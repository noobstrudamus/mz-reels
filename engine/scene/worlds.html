<!doctype html>
<html><head><meta charset="utf-8">
<!-- Mise-en-scene worlds (Mert 2026-11-13: "one format, different events; the port is only one of them").
     Same presenter rig, captions, overlays and flat end card as scene.html, but the story world is picked by
     {{WORLD}}: listing_takedown, warehouse_inbound, retailer_meeting, lab_report, factory_call, broker_email,
     launch_day, customer_return. Each world = 3 sets (A scene 1, B scene 2, C scenes 3-4), its own A->B and B->C
     transition, its own presenter side and opening. Timeline is a pure function of t: window.reel.seek(t).
     No real brand UI, logos, seals or place names in any set. -->
<style>
@font-face { font-family: 'Archivo'; src: url('../fonts/archivo-wdth.woff2'); font-weight: 100 900; }
@font-face { font-family: 'Inter2'; src: url('../fonts/public-sans.woff2'); font-weight: 100 900; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0b1630; }
#stage { position: absolute; inset: 0; }
#scrim { position: absolute; left: 0; right: 0; top: 0; height: 900px; background: linear-gradient(rgba(6,10,24,.92), rgba(6,10,24,.72) 62%, rgba(6,10,24,0)); z-index: 2; }
.cap { position: absolute; left: 70px; right: 70px; font-family: 'Archivo', sans-serif; color: #fff; font-weight: 850;
  text-shadow: 0 6px 24px rgba(0,0,0,.55); letter-spacing: -1px; z-index: 6; }
#cap1 { top: 230px; font-size: 92px; line-height: 1.0; }
#sub { position: absolute; left: 70px; right: 70px; top: 450px; font: 600 40px/1.25 'Inter2', sans-serif; color: #ffe7c2; text-shadow: 0 3px 14px rgba(0,0,0,.6); z-index: 6; }
#cite { position: absolute; left: 70px; right: 70px; top: 610px; font: 700 30px 'Inter2'; color: #9fe1ff; opacity: 0; z-index: 6; }
#brand { position: absolute; left: 70px; top: 120px; font: 800 34px 'Archivo'; color: #fff; letter-spacing: 1px; z-index: 6; }
#brand small { font: 700 20px 'Inter2'; letter-spacing: 4px; margin-left: 10px; opacity: .8; }
#foot { position: absolute; left: 70px; bottom: 270px; font: 500 24px 'Inter2'; color: rgba(255,255,255,.9); text-shadow: 0 2px 8px #000; z-index: 6; }
#hold { position: absolute; left: 380px; top: 720px; transform: translate(-50%,-50%) rotate(-8deg); font: 900 120px 'Archivo'; white-space: nowrap;
  color: #ff3b3b; border: 12px solid #ff3b3b; border-radius: 18px; padding: 10px 36px 4px; background: rgba(20,0,0,.55); opacity: 0; z-index: 4; }
#phone { position: absolute; left: 60px; top: 860px; width: 600px; background: #f4f6fb; border-radius: 40px; z-index: 4;
  box-shadow: 0 30px 80px rgba(0,0,0,.5); padding: 32px; box-sizing: border-box; opacity: 0; font-family: 'Inter2'; }
#phone .who { font: 700 28px 'Inter2'; color: #56607a; }
#phone .bub { margin-top: 18px; background: #2f6bff; color: #fff; border-radius: 30px 30px 30px 8px; padding: 26px 30px; font: 600 40px/1.25 'Inter2'; }
#laptop { position: absolute; left: 50px; top: 1020px; width: 620px; height: 440px; background: #0f172a; border: 16px solid #2b3245; z-index: 4;
  border-radius: 22px; box-sizing: border-box; padding: 28px 32px; opacity: 0; font-family: 'Inter2'; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
#laptop h3 { margin: 0 0 12px; font: 800 32px 'Archivo'; color: #9fb6ff; letter-spacing: 1px; }
#laptop .row { display: flex; justify-content: space-between; font: 600 30px 'Inter2'; color: #e6ebff; padding: 9px 0; border-bottom: 2px solid #26304a; }
#laptop .row b { color: #34d399; font-weight: 800; opacity: 0; }
#cta { position: absolute; inset: 0; opacity: 0; z-index: 7; background: linear-gradient(#0b1630, #13224a 60%, #0b1630); }
#cta .card { position: absolute; left: 70px; width: 520px; top: 1110px; background: #f3e9d2; border-radius: 22px; padding: 30px 34px; box-sizing: border-box;
  box-shadow: 10px 10px 0 #ffd166; font-family: 'Inter2'; }
#cta .card b { display: block; font: 900 26px 'Archivo'; letter-spacing: 5px; color: #1b2340; margin-bottom: 14px; }
#cta .card span { font: 600 34px/1.3 'Inter2'; color: #1b2340; }
#cta .h { position: absolute; left: 70px; right: 70px; top: 330px; font: 900 112px/1.0 'Archivo'; color: #fff; letter-spacing: -2px; text-shadow: 0 6px 24px #000a; }
#cta .l1 { position: absolute; left: 70px; top: 600px; font: 800 64px 'Archivo'; color: #ffd166; text-shadow: 0 4px 16px #000a; }
#cta .l2 { position: absolute; left: 70px; right: 440px; top: 690px; font: 600 50px/1.25 'Inter2'; color: #fff; text-shadow: 0 4px 16px #000a; }
#cta .url { position: absolute; left: 70px; top: 900px; font: 800 46px 'Archivo'; color: #0b1630; background: #ffd166; border-radius: 60px; padding: 22px 42px; }
#ava2 { position: absolute; z-index: 8; overflow: visible; }
#brand.top, #foot.top { z-index: 9; }
#offer { position: absolute; left: 70px; top: 1480px; max-width: 940px; z-index: 9; flex-wrap: wrap; row-gap: 4px; display: flex; align-items: center; gap: 18px;
  background: #ffd166; color: #0b1630; border-radius: 26px; padding: 18px 26px; box-shadow: 0 10px 30px rgba(0,0,0,.35); font-family: 'Inter2'; }
#offer b { font: 900 42px 'Archivo'; letter-spacing: -.5px; white-space: nowrap; }
#offer span { font: 700 28px/1.2 'Inter2'; }
</style></head>
<body>
<div id="stage">
<svg id="world" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs><clipPath id="clipB"><circle id="irisB" cx="540" cy="1300" r="3000"/></clipPath><clipPath id="clipC"><circle id="irisC" cx="540" cy="1300" r="3000"/></clipPath></defs>
  <g id="setA"></g><g id="wrapB" clip-path="url(#clipB)"><g id="setB"></g></g><g id="wrapC" clip-path="url(#clipC)"><g id="setC"></g></g>
</svg>
<div id="scrim"></div>
{{AVA}}
<div id="brand" class="top">M&amp;Z <small>CONSULTING</small></div>
<div class="cap" id="cap1"></div>
<div id="sub"></div>
<div id="cite"></div>
<div id="hold"></div>
<div id="phone"><div class="who"></div><div class="bub"></div></div>
<div id="laptop"><h3></h3><div class="row">a <b>✓</b></div><div class="row">a <b>✓</b></div><div class="row">a <b>✓</b></div><div class="row">a <b>✓</b></div><div class="row">a <b>✓</b></div></div>
<div id="cta"><div class="h"></div><div class="l1"></div><div class="l2"></div><div class="url"></div><div class="card"><b>M&amp;Z CONSULTING</b><span>It’s almost never the product. It’s the file.</span></div></div>
<div id="offer"><b></b><span></span></div>
<div id="foot" class="top">Illustrative example. Not legal advice.</div>
</div>
<script>
const T = {{TIMES}};
const CAP = {{CAPS}};
const MOUTH = {{MOUTH}};
const WORLD = {{WORLD}};
const RAW = {{PROPS}};
const $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const outB = x => { x = cl(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, a, b) => cl((t - a) / (b - a));
const at = (id, k, v) => { const e = $(id); if (e) e.setAttribute(k, v); };
const mv = (id, x, y, sx = 1, sy = sx, r = 0) => at(id, 'transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${r.toFixed(1)}) scale(${sx} ${sy})`);
const op = (id, v) => at(id, 'opacity', cl(v).toFixed(3));
// ---------- drawing helpers (flat shapes only; all text generic)
const R = (x, y, w, h, f, rx = 0, extra = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}" ${extra}/>`;
const C = (x, y, r, f, extra = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${extra}/>`;
const TX = (x, y, s, size, f, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.a || 'middle'}" font-family="${o.font || 'Archivo'}" font-weight="${o.w || 800}" font-size="${size}" fill="${f}" ${o.ls ? `letter-spacing="${o.ls}"` : ''} ${o.cls ? `class="${o.cls}"` : ''} ${o.id ? `id="${o.id}"` : ''}>${s}</text>`;
const GR = (id, c1, c2) => `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>`;
const BG = (id, c1, c2) => GR(id, c1, c2) + R(0, 0, 1080, 1920, `url(#${id})`);
// small person, origin at the feet, ~155 px tall at scale 1
const person = (id, shirt, skin, extra = '', legs = '#1f2a44') => `<g id="${id}">
  <line id="${id}a" x1="0" y1="-60" x2="-7" y2="0" stroke="${legs}" stroke-width="13" stroke-linecap="round"/><line id="${id}b" x1="0" y1="-60" x2="7" y2="0" stroke="${legs}" stroke-width="13" stroke-linecap="round"/>
  <rect x="-18" y="-124" width="36" height="68" rx="10" fill="${shirt}"/>
  <line id="${id}c" x1="-14" y1="-116" x2="-24" y2="-70" stroke="${shirt}" stroke-width="10" stroke-linecap="round"/><line id="${id}d" x1="14" y1="-116" x2="24" y2="-70" stroke="${shirt}" stroke-width="10" stroke-linecap="round"/>
  <circle cx="0" cy="-140" r="15" fill="${skin}"/>${extra}</g>`;
const walk = (id, ph, amp = 16) => { const s = Math.sin(ph) * amp; at(id + 'a', 'x2', -7 + s); at(id + 'b', 'x2', 7 - s); at(id + 'c', 'x2', -24 - s * .6); at(id + 'd', 'x2', 24 + s * .6); };
const carton = (w, h, label = true) => `<rect x="${-w / 2}" y="${-h}" width="${w}" height="${h}" fill="#c99a62" stroke="#8a6a3f" stroke-width="4"/><rect x="${-w / 2}" y="${-h}" width="${w}" height="${h * .16}" fill="#b98850"/><line x1="0" y1="${-h}" x2="0" y2="${-h * .84}" stroke="#8a6a3f" stroke-width="4"/>` +
  (label ? R(-w * .36, -h * .62, w * .72, h * .34, '#fff') + TX(0, -h * .38, '', Math.min(26, w * .11), '#1b1f29', { cls: 'p-box' }) : '');
// the place where she fixes the file (scenes 3-4); one variant per world
function fixSet(o) {
  let s = BG('fx' + o.k, o.wall[0], o.wall[1]);
  const wx = o.winX ?? 90;
  if (o.win === 'sun') s += R(wx, 780, 300, 360, '#ffe9b8', 8) + C(wx + 190, 900, 60, '#ffb347') + R(wx, 780, 300, 360, 'none', 8, 'stroke="#f7f2e6" stroke-width="14"') + R(wx + 143, 780, 14, 360, '#f7f2e6');
  if (o.win === 'moon') s += R(wx, 780, 300, 360, '#101c40', 8) + C(wx + 200, 880, 44, '#f4f1d0') + C(wx + 80, 860, 4, '#fff') + C(wx + 120, 1010, 4, '#fff') + R(wx, 780, 300, 360, 'none', 8, 'stroke="#3a4670" stroke-width="14"') + R(wx + 143, 780, 14, 360, '#3a4670');
  if (o.win === 'city') { s += R(wx, 780, 360, 360, '#27406e', 8); for (let i = 0; i < 6; i++) s += R(wx + 14 + i * 58, 960 - (i * 53 % 130), 46, 180 + (i * 53 % 130), '#16223f') + R(wx + 24 + i * 58, 990 - (i * 53 % 130), 10, 14, '#ffd27a'); s += R(wx, 780, 360, 360, 'none', 8, 'stroke="#55617f" stroke-width="14"'); }
  if (o.win === 'shelves') for (let r = 0; r < 3; r++) { s += R(wx - 30, 900 + r * 170, 520, 14, '#55607a'); for (let c = 0; c < 5; c++) s += R(wx - 10 + c * 98, 900 + r * 170 - 70 - (c * 7 + r * 11) % 30, 84, 70 + (c * 7 + r * 11) % 30, ['#c99a62', '#b98850', '#d6aa72'][(r + c) % 3], 2); }
  if (o.win === 'board') { s += R(wx, 780, 420, 320, '#f4f6fb', 10, 'stroke="#8792ad" stroke-width="10"'); for (let i = 0; i < 4; i++) s += R(wx + 30 + i * 96, 820 + (i % 2) * 120, 76, 76, ['#ffd166', '#ff8fa3', '#8ecae6', '#b7e4c7'][i], 4); }
  if (o.win === 'calendar') { s += R(wx, 780, 320, 340, '#f4f6fb', 10) + R(wx, 780, 320, 70, '#e14b3b', 10); for (let r = 0; r < 4; r++) for (let c = 0; c < 5; c++) s += R(wx + 26 + c * 56, 880 + r * 56, 40, 40, r === 2 && c === 3 ? '#ffd166' : '#dfe4ef', 6); }
  s += `<ellipse cx="${o.lampX || 800}" cy="1100" rx="460" ry="620" fill="${o.glow || '#ffd9a0'}" opacity=".16"/>`;
  s += R(0, 1540, 1080, 380, o.desk) + R(0, 1540, 1080, 14, o.deskTop || '#ffffff22');
  const ix = o.itemX || 800;
  if (o.item === 'mug') s += R(ix, 1450, 90, 96, '#f4f6fb', 10) + `<path d="M${ix + 90} 1470 q46 4 0 56" stroke="#f4f6fb" stroke-width="12" fill="none"/><path id="steam1" d="" stroke="#fff" stroke-width="6" fill="none" opacity=".5" stroke-linecap="round"/><path id="steam2" d="" stroke="#fff" stroke-width="6" fill="none" opacity=".35" stroke-linecap="round"/>`;
  if (o.item === 'plant') s += R(ix, 1460, 90, 84, '#c2643c', 8) + `<path d="M${ix + 45} 1460 q-70 -90 -20 -150 q30 60 20 150 q40 -110 80 -110 q0 80 -80 110" fill="#2f9e6b"/>`;
  if (o.item === 'binders') for (let i = 0; i < 4; i++) s += R(ix + i * 52, 1340, 46, 200, ['#2f6bff', '#e14b3b', '#27ae60', '#f2c94c'][i], 4) + R(ix + 10 + i * 52, 1370, 26, 50, '#fff', 3);
  if (o.item === 'boxes') s += `<g transform="translate(${ix + 70} 1540)">${carton(150, 110)}</g><g transform="translate(${ix + 150} 1432) scale(.8)">${carton(140, 100, false)}</g>`;
  if (o.item === 'lamp') s += R(ix + 40, 1470, 16, 70, '#222') + `<path d="M${ix} 1470 L${ix + 96} 1470 L${ix + 74} 1396 L${ix + 22} 1396 Z" fill="#e8c27a"/>`;
  if (o.item === 'monitors') s += R(ix - 20, 1300, 250, 170, '#0f172a', 10, 'stroke="#2b3245" stroke-width="10"') + R(ix + 90, 1470, 30, 70, '#2b3245') + R(ix, 1330, 120, 12, '#9fb6ff') + R(ix, 1360, 180, 12, '#3a4670') + R(ix, 1390, 150, 12, '#3a4670');
  s += `<g id="pdf" transform="rotate(${o.docR ?? 5} ${o.docX || 870} 1760)">${R((o.docX || 870) - 110, 1690, 220, 140, '#f4f6fb', 10)}${TX(o.docX || 870, 1773, '', 28, '#c0392b', { cls: 'p-doc', font: 'Inter2' })}</g>`;
  return s;
}
function steam(t, x) { for (let i = 1; i <= 2; i++) { const p = (t * .5 + i * .5) % 1, y = 1440 - p * 90; at('steam' + i, 'd', `M${x + 20 + i * 22} ${y} q14 -18 0 -36 q-14 -18 0 -36`); op('steam' + i, .55 * (1 - p)); } }

// ---------- worlds
const W = {};
// 1. the listing is pulled: night desk -> zoom into the listing page -> kitchen table next morning
W.listing_takedown = {
  side: 'R', tr: ['zoom', 'fade'], focus: [370, 1300], open: 'late',
  d: { hold: 'REMOVED', gate: 'Listing removed', phoneWho: 'Marketplace notice · 11:42 pm', phoneMsg: '“Your listing was removed. Compliance documents needed.”', doc: 'NOTICE' },
  A: () => BG('lt1', '#18204a', '#0a0e22') + R(80, 780, 320, 300, '#0d1b3d', 8) + C(300, 860, 40, '#f4f1d0') + C(318, 846, 36, '#0d1b3d') +
    [[120, 830], [180, 960], [250, 1010], [350, 990], [140, 1030], [210, 870]].map((p, i) => C(p[0], p[1], 4, '#fff', `id="st${i}"`)).join('') +
    R(80, 780, 320, 300, 'none', 8, 'stroke="#3a4670" stroke-width="14"') + R(233, 780, 14, 300, '#3a4670') +
    `<ellipse id="glowA" cx="370" cy="1300" rx="430" ry="330" fill="#7fb0ff" opacity=".22"/>` +
    R(0, 1560, 1080, 360, '#3a2b22') + R(0, 1560, 1080, 14, '#4c3a2e') +
    R(110, 1130, 520, 360, '#0f172a', 16, 'stroke="#2b3245" stroke-width="14"') + R(70, 1490, 600, 26, '#2b3245', 8) + R(140, 1160, 460, 300, '#eef1f6', 6) +
    R(160, 1180, 150, 150, '#dfe4ef', 8) + `<g transform="translate(235 1318) scale(.8)">${carton(130, 110)}</g>` + R(330, 1186, 240, 20, '#1b2340', 4) + R(330, 1220, 180, 14, '#9aa3b5', 4) + R(330, 1250, 110, 26, '#27ae60', 6) +
    R(330, 1296, 150, 44, '#ff9d2e', 22) + TX(405, 1327, 'Buy now', 22, '#1b1f29', { font: 'Inter2' }) + C(560, 1436, 10, '#27ae60', 'id="live"') + TX(540, 1444, 'LIVE', 22, '#27ae60', { a: 'end', font: 'Inter2' }) +
    `<g id="ph"><rect x="-50" y="-96" width="100" height="192" rx="18" fill="#111827" stroke="#56607a" stroke-width="5"/><rect id="phs" x="-40" y="-82" width="80" height="164" rx="10" fill="#1b2340"/><rect id="phn" x="-34" y="-70" width="68" height="40" rx="8" fill="#ff3b3b"/></g>` +
    `<g id="buzz" stroke="#ffd166" stroke-width="7" fill="none" stroke-linecap="round"><path d="M-80 -40 q-18 40 0 80"/><path d="M80 -40 q18 40 0 80"/><path d="M-106 -60 q-28 60 0 120"/><path d="M106 -60 q28 60 0 120"/></g>`,
  B: () => R(0, 0, 1080, 1920, '#e9edf4') + R(0, 900, 1080, 110, '#1b2340') + TX(70, 972, 'marketplace', 44, '#fff', { a: 'start', w: 900 }) + R(420, 925, 560, 60, '#fff', 30) + C(940, 955, 16, '#9aa3b5') +
    `<g id="page">` + R(50, 1050, 980, 640, '#fff', 20) + R(90, 1090, 330, 330, '#dfe4ef', 14) + `<g transform="translate(255 1390) scale(1.7)">${carton(130, 110)}</g>` +
    R(460, 1100, 500, 34, '#1b2340', 6) + R(460, 1154, 380, 24, '#9aa3b5', 6) + [0, 1, 2, 3, 4].map(i => `<path d="M${470 + i * 44} 1206 l10 22 l24 2 l-18 16 l6 24 l-22 -13 l-22 13 l6 -24 l-18 -16 l24 -2 z" fill="#ffb020" transform="translate(${470 + i * 44} 1226) scale(.6) translate(${-470 - i * 44} -1226)"/>`).join('') +
    R(460, 1290, 200, 54, '#27ae60', 8, 'id="price"') + R(460, 1370, 330, 80, '#ff9d2e', 40, 'id="buy"') + TX(625, 1424, 'Buy now', 36, '#1b1f29', { font: 'Inter2' }) +
    R(90, 1470, 880, 20, '#dfe4ef', 6) + R(90, 1510, 760, 20, '#dfe4ef', 6) + R(90, 1550, 820, 20, '#dfe4ef', 6) + `</g>` +
    R(50, 1050, 980, 640, '#8b93a5', 20, 'id="grey" opacity="0"') +
    `<g id="ban">` + R(90, 1180, 620, 110, '#c0392b', 16) + C(150, 1235, 30, '#fff') + TX(150, 1252, '!', 50, '#c0392b', { w: 900 }) + TX(200, 1252, '', 46, '#fff', { a: 'start', cls: 'p-gate' }) + `</g>` +
    `<path id="cur" d="M0 0 L0 54 L14 42 L24 66 L34 62 L24 38 L42 38 Z" fill="#111827" stroke="#fff" stroke-width="4"/>`,
  C: () => fixSet({ k: 1, wall: ['#f0c98a', '#d99a5b'], win: 'sun', desk: '#7a4b2e', item: 'mug', itemX: 130, docX: 300, docR: -5, glow: '#fff3c4', lampX: 300 }),
  tick(t, s) {
    for (let i = 0; i < 6; i++) op('st' + i, .5 + .5 * Math.sin(t * 3 + i * 1.7));
    const bz = t > 0.5 && t < s[1] ? 1 : 0, sh = bz && (t % 1.1) < .6 ? Math.sin(t * 70) * 5 : 0;
    mv('ph', 780 + sh, 1480, 1, 1, -8 + sh * .6); mv('buzz', 780, 1480, 1, 1, -8); op('buzz', bz && (t % 1.1) < .6 ? 1 : 0);
    op('phn', t > 0.5 ? 1 : 0); op('glowA', .2 + .05 * Math.sin(t * 2)); op('live', Math.sin(t * 6) > 0 ? 1 : .3);
    const k = ease(seg(t, s[1] + 1.5, s[1] + 2.0)); op('grey', k * .62);
    mv('ban', 0, lerp(-60, 0, outB(seg(t, s[1] + 1.5, s[1] + 1.9)))); op('ban', seg(t, s[1] + 1.5, s[1] + 1.7));
    const cp = ease(seg(t, s[1] + 0.5, s[1] + 1.4)); mv('cur', lerp(900, 640, cp), lerp(1640, 1420, cp));
    steam(t, 130);
  }
};
// 2. inbound refused: truck backs into the dock -> pan inside, the receiving line stops -> stockroom office
W.warehouse_inbound = {
  side: 'L', tr: ['pan', 'up'], open: 'walk',
  d: { hold: 'REFUSED', gate: 'RECEIVING', phoneWho: 'Inbound team · now', phoneMsg: '“We can’t receive these. The compliance file is incomplete.”', doc: 'INBOUND' },
